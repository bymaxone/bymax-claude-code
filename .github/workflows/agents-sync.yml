# Keeps the shared half of AGENTS.md in step with the canonical copy in
# bymaxone/.github. The rules that must not vary between Bymax repositories are
# edited there; everything this repository writes for itself lives outside the
# markers and is never touched.
#
# Codex reads AGENTS.md from the file tree of the repository under review, so a
# shared rule has to exist as a real file here rather than be referenced. That is
# why this is a sync and not a `uses:` — the reusable CI propagates by reference,
# this one has to propagate by commit.
name: agents-sync

on:
  schedule:
    # Weekly, off the hour. This repository has no other scheduled workflow, so
    # there is nothing to stagger against; the odd minute is a habit worth keeping
    # for when there is.
    - cron: '23 6 * * 2'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    # Referenced by the moving alias rather than pinned, which is the convention
    # for first-party reusables and the rule the shared block itself states.
    uses: bymaxone/.github/.github/workflows/agents-sync.yml@v1
    permissions:
      contents: write
      pull-requests: write
    secrets:
      # A GitHub App, not a PAT: the reusable mints a token per run, scoped to
      # this repository only, and revokes it in its post step. Both halves are
      # required together — the reusable treats exactly one as a hard failure
      # rather than falling back, which is the right shape for a credential.
      #
      # `sync-token` is deliberately absent. The reusable still accepts it, but
      # this organisation has no AGENTS_SYNC_TOKEN: mapping it would read as
      # configured while resolving to empty, and the run would fall back to the
      # default GITHUB_TOKEN.
      #
      # Why that fallback matters: a pull request opened with the default
      # GITHUB_TOKEN starts no workflow runs, so the sync would merge without
      # `validate.yml` ever proving the synced file still parses.
      app-id: ${{ secrets.AGENTS_SYNC_APP_ID }}
      app-private-key: ${{ secrets.AGENTS_SYNC_PRIVATE_KEY }}
